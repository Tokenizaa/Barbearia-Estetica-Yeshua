<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="50%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Gold Border -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" />

  <!-- Center Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)" />

  <!-- Outer Ring Detail -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Crossed Barber Scissors & Comb / Luxury Crest -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Scissor Blades -->
    <path d="M-60,70 L60,-70" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" />
    <path d="M60,70 L-60,-70" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- Center Pivot Gem -->
    <circle cx="0" cy="0" r="16" fill="#0a0a0c" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="0" cy="0" r="6" fill="#fef08a" />

    <!-- Left Handle -->
    <circle cx="-75" cy="85" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
    <!-- Right Handle -->
    <circle cx="75" cy="85" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="14" />

    <!-- Crown / Star at Top -->
    <path d="M0,-110 L14,-80 L44,-76 L22,-54 L27,-24 L0,-38 L-27,-24 L-22,-54 L-44,-76 L-14,-80 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Neutral icon for the white-label salon platform -->
</svg>