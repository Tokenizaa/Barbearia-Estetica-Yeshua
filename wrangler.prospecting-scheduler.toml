name = "barbearia-yeshua-prospecting-scheduler"
main = "workers/prospecting-scheduler/src/index.ts"
compatibility_date = "2026-10-20"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
PROSPECTING_BATCH_SIZE = "10"

# Configure these as encrypted Worker secrets, never as vars:
# wrangler secret put SUPABASE_URL --config wrangler.prospecting-scheduler.toml
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.prospecting-scheduler.toml
# wrangler secret put PROSPECTING_WORKER_SECRET --config wrangler.prospecting-scheduler.toml
